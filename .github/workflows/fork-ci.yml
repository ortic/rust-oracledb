# CI of the ortic fork (branch `pythia`, used by github.com/ortic/pythia):
# lints and runs the driver's own test suite against Oracle Free. Not part of
# upstream oracle/rust-oracledb.
name: Fork CI

on:
  push:
    branches: [pythia]
  pull_request:
  # Weekly, to notice a changed Oracle Free image before the next push does.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: oracle
        ports:
          - 1521:1521
          - 2484:2484
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      RSO_TEST_MAIN_USER: rsotest
      RSO_TEST_MAIN_PASSWORD: Rsotest_1
      RSO_TEST_CONNECT_STRING: localhost:1521/FREEPDB1
      RSO_TEST_ADMIN_USER: system
      RSO_TEST_ADMIN_PASSWORD: oracle
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --all-features
      # Oracle Free's listener refuses connections opened at once
      # (ORA-12516) long before its PROCESSES limit of 200 is reached; with
      # more headroom it doesn't.
      - name: Raise the process limit
        run: |
          docker exec -i ${{ job.services.oracle.id }} sqlplus -s / as sysdba <<'EOF'
          whenever sqlerror exit failure
          alter system set processes = 1000 scope = spfile;
          EOF
          docker restart ${{ job.services.oracle.id }}
          until [ "$(docker inspect -f '{{.State.Health.Status}}' ${{ job.services.oracle.id }})" = healthy ]; do
            sleep 5
          done
      # What `cargo run --bin create_test_schema` grants, except CTXAPP:
      # Oracle Text isn't part of Oracle Free.
      - name: Create the test user
        run: |
          docker exec -i ${{ job.services.oracle.id }} sqlplus -s system/oracle@FREEPDB1 <<'EOF'
          whenever sqlerror exit failure
          create user rsotest identified by Rsotest_1;
          grant create session, create table, create procedure, create type,
                create view, select any dictionary, change notification,
                unlimited tablespace to rsotest;
          EOF
      - run: cargo test --all-features --no-fail-fast
      # The suite again over TLS (cancelling included), with a self-signed
      # certificate; enable-tcps.sh runs Oracle's wallet tool on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Enable TLS (TCPS) on port 2484
        run: .github/scripts/enable-tcps.sh ${{ job.services.oracle.id }} "$RUNNER_TEMP/wallet"
      - name: Test over TLS
        run: cargo test --all-features --no-fail-fast
        env:
          RSO_TEST_CONNECT_STRING: tcps://localhost:2484/FREEPDB1
          RSO_TEST_WALLET_LOCATION: ${{ runner.temp }}/wallet
      # The suite again over Native Network Encryption, which the database
      # then requires, of clients that don't use weak algorithms
      # (sqlnet.ora is read for each connection).
      - name: Require Native Network Encryption
        run: |
          docker exec -i ${{ job.services.oracle.id }} bash -c 'cat >> "$ORACLE_HOME/network/admin/sqlnet.ora"' <<'EOF'
          SQLNET.ALLOW_WEAK_CRYPTO_CLIENTS = FALSE
          SQLNET.ENCRYPTION_SERVER = REQUIRED
          SQLNET.CRYPTO_CHECKSUM_SERVER = REQUIRED
          EOF
      - name: Test over Native Network Encryption
        run: cargo test --all-features --no-fail-fast
        env:
          RSO_TEST_NATIVE_NETWORK_ENCRYPTION: accepted
